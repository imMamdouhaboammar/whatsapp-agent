name: CI & Quality Gate

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Unit, Integration & UI Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install System Media Utilities
        run: sudo apt-get update && sudo apt-get install -y webp ffmpeg

      - name: Install Dependencies
        run: |
          bun install
          cd ui && bun install

      - name: Run Backend Test Suite
        run: bun test

      - name: Run UI SSR Tests & Vite Production Build
        run: |
          cd ui
          bun test:ui
          bun run build

      - name: Sourcery Action
        uses: sourcery-ai/action@438ce67e9f15fbeacb72257da23e2fffb1b6d354 # v1
        with:
          token: ${{ secrets.SOURCERY_TOKEN }}
        continue-on-error: true

  static-checks:
    name: Typecheck and Lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript (no emit, compiler pinned in bun.lock)
        run: bunx --no-install tsc --noEmit

      - name: Oxlint (correctness rules, config in .oxlintrc.json)
        run: bunx oxlint@1.94.0 src tests

  qlty:
    name: Qlty Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Qlty CLI
        run: curl https://qlty.sh | sh

      - name: Run Qlty Check
        run: ~/.qlty/bin/qlty check --all --no-formatters

  trufflehog:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          extra_args: --exclude-paths=.trufflehog-exclude --only-verified
