name: Strict Lint & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anti-suppression-guard:
    name: Anti-Suppression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Verify guard
        run: bun scripts/quality-guard.mjs self-test
      - name: Reject newly introduced suppressions and secrets
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/quality-guard.mjs range "$BASE" "$HEAD"
      - name: Check direct pushes
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: bun scripts/quality-guard.mjs range "$BASE" "$HEAD"
      - name: Check manually dispatched branch
        if: github.event_name == 'workflow_dispatch'
        run: bun scripts/quality-guard.mjs range origin/main HEAD

  ts-bun-gate:
    name: TypeScript, Oxlint & UI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install system media utilities
        run: sudo apt-get update && sudo apt-get install -y webp ffmpeg
      - name: Install frozen dependencies
        env:
          LEFTHOOK: "0"
        run: |
          bun install --frozen-lockfile
          (cd ui && bun install --frozen-lockfile)
      - name: Strict lint
        run: bun run lint:ts
      - name: Strict type check
        run: bun run typecheck
      - name: Backend tests
        run: bun test
      - name: UI tests and production build
        working-directory: ui
        run: bun test:ui && bun run build
      - name: CLI preflight
        run: bun run cli doctor --preflight --strict

  python-gate:
    name: Python Worker Lint & Type Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
      - name: Ruff lint and format
        run: |
          uvx --from ruff==0.17.4 ruff check workers/media-python
          uvx --from ruff==0.17.4 ruff format --check workers/media-python
      - name: Worker types and tests
        run: |
          uv run --no-project --with-requirements workers/media-python/requirements.txt --with mypy==2.4.1 --with types-openpyxl==3.1.5.20261122 mypy --strict workers/media-python
          uv run --no-project --with-requirements workers/media-python/requirements.txt pytest workers/media-python

  infra-gate:
    name: Starlark, Dockerfile & Compose Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Buildifier
        run: go install github.com/bazelbuild/buildtools/buildifier@f6a1982250030df9c2d24a675a04f150ff6aca6b
      - name: Lint tracked Starlark files
        shell: bash
        run: |
          git ls-files -z -- 'BUCK' ':(glob)**/BUCK' ':(glob)**/*.bzl' | while IFS= read -r -d '' file; do
            if [[ "$(basename "$file")" == BUCK ]]; then
              "$(go env GOPATH)/bin/buildifier" -mode=check -lint=warn -type=build "$file"
            else
              "$(go env GOPATH)/bin/buildifier" -mode=check -lint=warn -type=bzl "$file"
            fi
          done
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Validate Compose
        env:
          AGENT_DASHBOARD_TOKEN: ci-compose-validation-only
          GEMINI_API_KEY: ci-compose-validation-only
        run: docker compose config --quiet
