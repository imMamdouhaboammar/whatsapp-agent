name: Security Audit & GitHub Advisory Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: GitHub Advisory PR Review Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review (GitHub Advisory Database)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  security-audit:
    name: Repository Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Node & Bun Dependencies
        run: |
          bun install
          cd ui && bun install

      - name: Install verified OSV-Scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scanner_path="$RUNNER_TEMP/osv-scanner_linux_amd64"
          if ! curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$scanner_path"; then
            # GitHub release CDN can return 504 even after retries.
            # The pinned release asset is also available through the GitHub API.
            gh api -H 'Accept: application/octet-stream' \
              repos/google/osv-scanner/releases/assets/632251666 > "$scanner_path"
          fi
          printf '%s  %s\n' \
            '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b' \
            "$scanner_path" | sha256sum --check --
          sudo install -m 0755 "$scanner_path" /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run Dependency Audit (Fail on High or Critical)
        run: bun run security:audit

      - name: Audit Python Worker Dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r workers/media-python/requirements.txt
