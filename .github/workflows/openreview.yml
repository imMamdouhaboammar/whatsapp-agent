name: OpenReview PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    name: OpenReview Autonomous Review
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@openreview'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Verify OpenReview Configuration & Invariants
        run: |
          bun test tests/github-webhook.test.ts
          python3 -c "import json; cfg = json.load(open('openreview.config.json')); assert cfg['version'] == '1.0.0'; print('OpenReview configuration verified.')"
